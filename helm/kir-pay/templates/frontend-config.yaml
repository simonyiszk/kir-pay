{{ if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-frontend
  name: {{ .Release.Name }}-frontend-config
data:
  VITE_BACKEND_URL: "{{ if .Values.app.backendUrl }}{{ .Values.app.backendUrl }}{{ else }}https://{{ .Values.app.host }}{{ end }}"
{{ end }}
